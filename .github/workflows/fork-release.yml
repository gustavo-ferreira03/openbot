name: Fork release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build, for example v0.53.2. Empty builds the latest release.
        required: false
      replace:
        description: Replace a fork release that already has this tag.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM: nightly-labs/openbot

jobs:
  check:
    name: Find a new upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      build: ${{ steps.find.outputs.build }}
    steps:
      - name: Sync main with upstream
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main

      - name: Compare releases
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          tag=${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$REPLACE" != true ]; then
            echo "The fork already has $tag."
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "Building $tag."
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.check.outputs.tag }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false

      - name: Check out fork patches
        uses: actions/checkout@v4
        with:
          ref: fork
          path: .fork
          persist-credentials: false

      - name: Apply patches
        run: |
          set -euo pipefail
          for patch in .fork/patches/*.patch; do
            if git apply --check "$patch" 2>/dev/null; then
              git apply "$patch"
              echo "Applied $(basename "$patch")."
            elif git apply --reverse --check "$patch" 2>/dev/null; then
              echo "Upstream already has $(basename "$patch")."
            else
              echo "::error::$(basename "$patch") does not apply to $TAG."
              exit 1
            fi
          done
          sed -i "s|^RELEASES=https://github.com/$UPSTREAM/releases\$|RELEASES=https://github.com/$GITHUB_REPOSITORY/releases|" scripts/hosting/openbot-hosted-update
          grep -qx "RELEASES=https://github.com/$GITHUB_REPOSITORY/releases" scripts/hosting/openbot-hosted-update
          rm -rf .fork

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Install provider runtimes
        run: |
          bun scripts/install-codex-runtime.ts linux x64
          bun scripts/install-claude-runtime.ts linux x64
          bun scripts/install-grok-runtime.ts linux x64

      - name: Build AppImage
        run: bun run dist:linux

      - name: Check AppImage and updater manifest
        run: |
          set -euo pipefail
          version=${TAG#v}
          test -x "dist/OpenBot-$version-x86_64.AppImage"
          grep -Fq "version: $version" dist/latest-linux.yml
          grep -Fq "path: OpenBot-$version-x86_64.AppImage" dist/latest-linux.yml
          (cd dist && sha256sum "OpenBot-$version-x86_64.AppImage" > SHA256SUMS-linux.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          notes="OpenBot $version from $UPSTREAM, Linux x64 only, with the patches of the fork branch. Upstream notes: https://github.com/$UPSTREAM/releases/tag/$TAG"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target fork --latest \
            --title "OpenBot $version (fork)" --notes "$notes" \
            "dist/OpenBot-$version-x86_64.AppImage" dist/latest-linux.yml dist/SHA256SUMS-linux.txt
